# Optimized amd64 caches measured 625 MB Stack root + 1.754 GB app artifacts.
# Allow headroom for optimized objects, two architectures, and compiler upgrades.
[worker.oci]
  gc = true

  [[worker.oci.gcpolicy]]
    filters = ["type==exec.cachemount"]
    keepDuration = "2160h"
    reservedSpace = "12GB"
    maxUsedSpace = "24GB"

  [[worker.oci.gcpolicy]]
    all = true
    keepDuration = "720h"
    reservedSpace = "24GB"
    maxUsedSpace = "48GB"
    minFreeSpace = "15GB"
